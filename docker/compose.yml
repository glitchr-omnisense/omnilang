# omnisense/omnilang with every omnilang/* provider:
#
#   docker compose run --rm omnilang test       # every package's tests (recorded answers, no network)
#   docker compose run --rm omnilang bare       # plain PHP: a registry, a fallback, a detection, a glossary, a document - and what PHP loaded
#   docker compose run --rm omnilang phpstan    # PHPStan, each package at the highest level
#   docker compose down -v                      # the harness's volume gone
#
# No live command: every engine needs a key but LibreTranslate, and no public LibreTranslate
# server says it may be called by a program without one (2026-11-10). Run your own
# (docker run libretranslate/libretranslate) to try it.
#
# Providers come from GitHub (branch 1.x) unless their checkout sits under OMNILANG_PLUGINS (set it
# to ../.. in .env when this core sits in the workspace beside them): then that checkout is what runs.
# omnisense/contracts likewise: its checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts
# in .env when it sits beside the family's folder), its tests run with the family's; GitHub otherwise.
name: omnilang-harness

services:
  omnilang:
    build: .
    image: omnisense/omnilang-harness
    entrypoint: ["/omnilang/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnilang/core
      - ${OMNILANG_PLUGINS:-./plugins}:/omnilang/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
